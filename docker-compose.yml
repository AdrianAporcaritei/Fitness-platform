services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: anafitlab
      POSTGRES_USER: anafitlab
      POSTGRES_PASSWORD: anafitlab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  postgres-data:
