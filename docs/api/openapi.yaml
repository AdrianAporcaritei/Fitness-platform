openapi: 3.1.0
info:
  title: Ana Fit Lab API
  version: 0.1.0
  description: >
    Hand-written contract; each endpoint is added here before it is implemented.
    Errors follow RFC 9457 (application/problem+json) with a stable machine-readable `code`.
servers:
  - url: /api/v1
paths:
  /me:
    get:
      operationId: getMe
      summary: The authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing, invalid or expired access token, or the user no longer exists.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /me/password:
    post:
      operationId: changePassword
      summary: Change the password of the authenticated user.
      description: >
        Revokes every session except the one identified by refreshToken. If refreshToken is not one of the
        caller's tokens, all sessions are revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          description: Validation failed (PASSWORD_POLICY, REQUIRED), or INVALID_CURRENT_PASSWORD.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many wrong current passwords (shares the login budget of 5 per email per 15 minutes).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/register/coach:
    post:
      operationId: registerCoach
      summary: Sign up as a coach. Creates a PENDING account, sends a verification email and returns a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCoachRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failed (codes in `errors[]`, e.g. REQUIRED, INVALID_EMAIL, TOO_LONG, PASSWORD_POLICY, INVALID_LOCALE, INVALID_TIMEZONE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: EMAIL_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: RATE_LIMITED (10 signups per IP per hour); see Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/login:
    post:
      operationId: login
      summary: Sign in with email and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: INVALID_CREDENTIALS (identical for unknown email and wrong password).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: ACCOUNT_SUSPENDED (only after a correct password).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: RATE_LIMITED (5 failures per email or 20 per IP per 15 minutes); see Retry-After.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a refresh token for a new session (rotation with reuse detection).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token and new refresh token in the same family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >-
            INVALID_REFRESH_TOKEN (unknown, expired or revoked) or REFRESH_TOKEN_REUSED
            (a rotated token was presented again; its whole family is revoked).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: ACCOUNT_SUSPENDED (the family is revoked).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the session (token family) of the given refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out (also for an unknown token).
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session of the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All sessions revoked.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with the token from the verification email.
      description: Sets email_verified_at. PENDING becomes ACTIVE; SUSPENDED stays SUSPENDED. The token is single use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          description: Validation failed, or INVALID_TOKEN (unknown, used, expired or wrong-purpose token).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/verify-email/resend:
    post:
      operationId: resendVerificationEmail
      summary: Send a new verification email to the authenticated user.
      description: Invalidates earlier verification tokens. A no-op (still 204) unless the user is PENDING. Limited to 3 per user per hour.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Email sent, or nothing to do.
        '401':
          description: Not authenticated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset email.
      description: >
        Always 202 with no body, whether or not the email belongs to an account (suspended accounts get no email).
        Limited to 3 per email and 10 per IP per hour.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with the token from the reset email.
      description: >
        Single-use token valid for 1 hour. Revokes all refresh tokens, verifies a PENDING user (ACTIVE) and
        returns a new session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password changed; new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Validation failed (PASSWORD_POLICY, REQUIRED), or INVALID_TOKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: ACCOUNT_SUSPENDED. Nothing is changed and the token stays usable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 10
          maxLength: 64
          description: 10-64 characters and at most 72 UTF-8 bytes.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, refreshToken]
      properties:
        currentPassword:
          type: string
          maxLength: 200
        newPassword:
          type: string
          minLength: 10
          maxLength: 64
          description: 10-64 characters and at most 72 UTF-8 bytes.
        refreshToken:
          type: string
          description: Refresh token of the current session; that session is kept.
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Localized from the user's locale, or Accept-Language when unauthenticated.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable error code.
        errors:
          type: array
          description: Present for validation failures.
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
    UserResponse:
      type: object
      required: [id, email, role, status, firstName, lastName, locale, timezone]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [COACH, CLIENT, ADMIN]
        status:
          type: string
          enum: [PENDING, ACTIVE, SUSPENDED]
        firstName:
          type: string
        lastName:
          type: string
        locale:
          type: string
          enum: [ro, en]
        timezone:
          type: string
          description: IANA time zone name.
    RegisterCoachRequest:
      type: object
      required: [email, password, firstName, lastName, locale, timezone]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 64
          description: 10-64 characters and at most 72 UTF-8 bytes.
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        locale:
          type: string
          enum: [ro, en]
        timezone:
          type: string
          description: IANA time zone name.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 200
    TokenResponse:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserResponse'
